[Service]
Environment=DMS_SHELL_DIR=%h/.local/share/dms-shell-custom
# El paquete trae Type=dbus + BusName=org.freedesktop.Notifications + Restart=on-failure.
# Si qs (dueño del nombre, no el MainPID) muere, systemd para el servicio con
# Result=success y on-failure no lo levanta: barra muerta hasta reinicio manual.
# always lo devuelve en ~1.4 s (medido 2026-10-09 con SIGSEGV a qs).
# No usar Type=simple: el crash handler de quickshell retiene el servicio ~20 s
# y no relanza si qs muere antes de 10 s de vida.
Restart=always
